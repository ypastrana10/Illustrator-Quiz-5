<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 5: Color, Posters &amp; Export • Episodes 17–19</title><style>
*{box-sizing:border-box}body{font:16px system-ui,Arial,sans-serif;background:#eef3fa;color:#142b47;margin:0}.wrap{max-width:820px;margin:28px auto;padding:26px;background:white;border-radius:14px;box-shadow:0 5px 22px #b5c3d3}h1{color:#183e75}fieldset{border:1px solid #c8d6e7;border-radius:9px;margin:18px 0;padding:17px}legend{font-weight:700;line-height:1.4}label{display:block;padding:10px;margin:5px 0;border-radius:6px;cursor:pointer}label:hover{background:#f0f5ff}label:has(input:checked){outline:1px solid #759bcb;background:#eef5ff}button{background:#1b4c91;color:white;border:0;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer;margin:4px 6px 4px 0}.good{background:#e1f6e6!important}.bad{background:#ffe5e5!important}.feedback{margin:10px 0 0;font-weight:600}.missing{border-color:#b94a4a;background:#fff9f9}#result{font-size:21px;font-weight:bold;padding:15px 0}#notice{color:#aa2934;font-weight:600}#progress{color:#53677b}.actions{margin:18px 0}@media(max-width:600px){.wrap{margin:0;padding:18px;border-radius:0}}@media print{button,#notice{display:none}.wrap{box-shadow:none}fieldset{break-inside:avoid}}
</style></head><body><main class="wrap"><h1>Quiz 5: Color, Posters &amp; Export • Episodes 17–19</h1><p>Gareth David Studio • Illustrator beginner course • 15 questions • Select one answer for each question.</p><p id="progress" aria-live="polite">0 of 15 answered</p><form id="quiz"></form><div class="actions"><button id="grade" type="button">Submit &amp; Grade Quiz</button><button id="retake" type="button">Retake Quiz</button><button id="print" type="button" hidden>Print Results</button></div><p id="notice" role="alert"></p><div id="result" role="status" aria-live="polite"></div></main><script>
const Q=[{"question": "Which design principle helps make a poster headline stand out?", "options": ["Path simplification", "Rasterization", "Overprinting", "Visual hierarchy"], "answer": 3}, {"question": "What does contrast help achieve in poster typography?", "options": ["Improved distinction and readability", "Automatic path closure", "Higher pixel count", "Fewer artboards"], "answer": 0}, {"question": "Why use consistent swatches across an illustration?", "options": ["Flatten all artwork", "Maintain a cohesive color palette", "Remove every stroke", "Prevent any edits"], "answer": 1}, {"question": "What does outlining text do?", "options": ["Adds a linked font file", "Changes the artboard size", "Converts type to vector shapes", "Converts vectors to photos"], "answer": 2}, {"question": "What is bleed in print design?", "options": ["A gradient with two colors", "A text paragraph setting", "A stroke alignment mode", "Artwork extending beyond the trim edge"], "answer": 3}, {"question": "Why extend a background into the bleed area?", "options": ["Avoid white edges after trimming", "Increase font size", "Reduce ink to zero", "Add anchor points"], "answer": 0}, {"question": "Which format is commonly used to deliver print-ready artwork?", "options": ["SVG animation", "PDF", "GIF", "BMP"], "answer": 1}, {"question": "What is the purpose of crop or trim marks?", "options": ["Lock the document", "Change a color swatch", "Indicate where a printed sheet should be cut", "Show the font kerning"], "answer": 2}, {"question": "What is a linked image?", "options": ["A vector shape with a hole", "A text path with a gradient", "A saved brush preset", "An external file referenced by the Illustrator document"], "answer": 3}, {"question": "Why package a document for handoff?", "options": ["Collect linked assets and fonts when permitted", "Remove all artboards", "Delete editable paths", "Turn every color into RGB"], "answer": 0}, {"question": "What should you check before exporting a poster?", "options": ["Only guide color", "Artboard, color mode, bleed and fonts", "Only zoom percentage", "Only selected tool"], "answer": 1}, {"question": "What does embedding a placed image do?", "options": ["Makes all pixels vector paths", "Removes the artboard", "Stores the image data in the Illustrator file", "Deletes the source file"], "answer": 2}, {"question": "Which type alignment is typically easiest to read for long body text?", "options": ["Randomly staggered alignment", "Every line at a different angle", "Overlapping centered letters", "Consistent left alignment"], "answer": 3}, {"question": "What is the main purpose of the final proofread?", "options": ["Catch spelling and content errors", "Increase vector anchor count", "Reset the workspace", "Change stroke caps"], "answer": 0}, {"question": "Why save the editable AI file as well as a PDF?", "options": ["Remove all colors", "Preserve a working source for future changes", "Make the PDF contain no text", "Prevent printing"], "answer": 1}];
const form=document.getElementById('quiz');const result=document.getElementById('result');const notice=document.getElementById('notice');const gradeButton=document.getElementById('grade');const printButton=document.getElementById('print');let graded=false;
Q.forEach((q,i)=>{const fs=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q.question;fs.append(legend);q.options.forEach((option,k)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=k;input.addEventListener('change',()=>{fs.classList.remove('missing');updateProgress();notice.textContent=''});label.append(input,document.createTextNode(' '+String.fromCharCode(65+k)+'. '+option));fs.append(label)});const feedback=document.createElement('p');feedback.className='feedback';fs.append(feedback);form.append(fs)});
function updateProgress(){const count=Q.filter((q,i)=>form.querySelector('input[name="q'+i+'"]:checked')).length;document.getElementById('progress').textContent=count+' of '+Q.length+' answered'}
function grade(){if(graded)return;const missing=Q.map((q,i)=>form.querySelector('input[name="q'+i+'"]:checked')?null:i+1).filter(x=>x!==null);form.querySelectorAll('fieldset').forEach((fs,i)=>fs.classList.toggle('missing',missing.includes(i+1)));if(missing.length){notice.textContent='Please answer these questions before submitting: '+missing.join(', ')+'.';form.children[missing[0]-1].scrollIntoView({behavior:'smooth',block:'center'});return}let score=0;Q.forEach((q,i)=>{const fs=form.children[i];const chosen=Number(fs.querySelector('input:checked').value);if(chosen===q.answer)score++;fs.querySelectorAll('label').forEach((label,k)=>{label.classList.toggle('good',k===q.answer);label.classList.toggle('bad',k===chosen&&chosen!==q.answer)});const feedback=fs.querySelector('.feedback');feedback.textContent=(chosen===q.answer?'✓ Correct. ':'✗ Incorrect. ')+'Correct answer: '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer];fs.querySelectorAll('input').forEach(input=>input.disabled=true)});graded=true;gradeButton.disabled=true;gradeButton.textContent='Quiz Submitted';printButton.hidden=false;notice.textContent='';result.textContent='Your score: '+score+' / '+Q.length+' ('+Math.round(score/Q.length*100)+'%). Green = correct answer; red = incorrect selection.';result.scrollIntoView({behavior:'smooth',block:'center'})}
function retake(){graded=false;form.reset();form.querySelectorAll('fieldset').forEach(fs=>{fs.classList.remove('missing');fs.querySelector('.feedback').textContent='';fs.querySelectorAll('input').forEach(input=>input.disabled=false);fs.querySelectorAll('label').forEach(label=>label.classList.remove('good','bad'))});gradeButton.disabled=false;gradeButton.textContent='Submit & Grade Quiz';printButton.hidden=true;notice.textContent='';result.textContent='';updateProgress();window.scrollTo({top:0,behavior:'smooth'})}
gradeButton.addEventListener('click',grade);document.getElementById('retake').addEventListener('click',retake);printButton.addEventListener('click',()=>window.print());updateProgress();
</script></body></html>
